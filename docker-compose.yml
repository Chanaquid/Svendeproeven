version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7183:8080"
    depends_on:
      db:
        condition: service_healthy   # wait until SQL Server is actually ready
    env_file:
      - .env

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rentit-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s   # give SQL Server time to boot before first check

volumes:
  sql_data: