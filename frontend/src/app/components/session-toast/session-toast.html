<div *ngIf="visible" class="session-toast" role="alertdialog" aria-live="polite">
  <div class="session-toast-header">
    <span class="session-toast-icon">⏳</span>
    <p class="session-toast-title">Session udløber snart</p>
  </div>

  <p class="session-toast-msg">
    Du logges ud om <strong>{{ countdownLabel }}</strong>.
  </p>

  <div class="session-toast-progress">
    <div class="session-toast-progress-bar" [style.width.%]="progressPct"></div>
  </div>

  <div class="session-toast-actions">
    <button type="button" class="btn btn-outline btn-sm" (click)="dismiss()">Log ud</button>
    <button type="button" class="btn btn-primary btn-sm" [disabled]="extending" (click)="extend()">
      <span *ngIf="!extending">Forbliv logget ind</span>
      <span *ngIf="extending">Forlænger…</span>
    </button>
  </div>
</div>
