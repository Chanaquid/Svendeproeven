<div class="auth-page">
  <nav class="topbar">
    <a routerLink="/" class="topbar-brand">RentIt</a>
    <div class="topbar-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Skift til lyst tema' : 'Skift til mørkt tema'"
      >
        {{ theme.theme() === 'dark' ? '☀️' : '🌙' }}
      </button>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Opret Konto</h1>
      <p class="subtitle">Bliv en del af fællesskabet</p>

      <form (ngSubmit)="register()" #regForm="ngForm" class="form">
        <!-- Avatar -->
        <div class="avatar-row">
          <div class="avatar-preview">
            <img *ngIf="avatarPreview" [src]="avatarPreview" alt="" />
            <span *ngIf="!avatarPreview">👤</span>
          </div>
          <div class="avatar-actions">
            <label class="btn btn-outline btn-sm">
              {{ avatarPreview ? 'Skift billede' : 'Vælg billede' }}
              <input type="file" accept="image/*" (change)="onAvatarSelected($event)" hidden />
            </label>
            <button
              *ngIf="avatarPreview"
              type="button"
              class="btn btn-ghost btn-sm"
              (click)="removeAvatar()"
            >
              Fjern
            </button>
          </div>
        </div>

        <div class="field">
          <label for="fullName">Fulde Navn</label>
          <input id="fullName" type="text" name="fullName" [(ngModel)]="dto.fullName" required placeholder="Anders Hansen" />
        </div>

        <div class="field">
          <label for="username">Brugernavn</label>
          <input id="username" type="text" name="username" [(ngModel)]="dto.username" required placeholder="anders" />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" name="email" [(ngModel)]="dto.email" required placeholder="anders@example.dk" />
        </div>

        <div class="form-row">
          <div class="field">
            <label for="dateOfBirth">Fødselsdato</label>
            <input id="dateOfBirth" type="date" name="dateOfBirth" [(ngModel)]="dto.dateOfBirth" required />
          </div>
          <div class="field">
            <label for="gender">Køn</label>
            <select id="gender" name="gender" [(ngModel)]="dto.gender" required>
              <option value="" disabled>Vælg…</option>
              <option value="Male">Mand</option>
              <option value="Female">Kvinde</option>
              <option value="Other">Andet</option>
            </select>
          </div>
        </div>

        <div class="field address-field">
          <label for="address">Adresse</label>
          <input
            id="address"
            type="text"
            name="address"
            [(ngModel)]="dto.address"
            (input)="onAddressInput(dto.address)"
            required
            placeholder="Søg adresse…"
            autocomplete="off"
          />
          <ul *ngIf="showSuggestions && suggestions.length > 0" class="address-suggestions">
            <li *ngFor="let s of suggestions" (click)="selectSuggestion(s)">
              {{ s.properties.formatted }}
            </li>
          </ul>
        </div>

        <div class="field">
          <label for="password">Adgangskode</label>
          <input id="password" type="password" name="password" [(ngModel)]="dto.password" required placeholder="••••••••" />
        </div>

        <div class="field">
          <label for="confirmPassword">Bekræft Adgangskode</label>
          <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="dto.confirmPassword" required placeholder="••••••••" />
        </div>

        <label class="terms-row">
          <input type="checkbox" name="acceptedTerms" [(ngModel)]="acceptedTerms" required />
          <span>Accepter betingelser</span>
        </label>

        <p *ngIf="errorMessage" class="form-error">{{ errorMessage }}</p>
        <p *ngIf="successMessage" class="form-success">{{ successMessage }}</p>

        <button
          type="submit"
          [disabled]="regForm.invalid || isLoading || !acceptedTerms"
          class="btn btn-primary submit-btn"
        >
          <span *ngIf="!isLoading">Opret Konto</span>
          <span *ngIf="isLoading">{{ isUploadingAvatar ? 'Uploader billede...' : 'Opretter konto...' }}</span>
        </button>
      </form>

      <p class="auth-footer">
        Har du allerede en konto?
        <a routerLink="/login">Log ind</a>
      </p>
    </div>
  </div>
</div>
