<div class="auth-page">
  <nav class="topbar">
    <a routerLink="/" class="topbar-brand">RentIt</a>
    <div class="topbar-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Skift til lyst tema' : 'Skift til mørkt tema'"
      >
        {{ theme.theme() === 'dark' ? '☀️' : '🌙' }}
      </button>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card status-card">
      <div *ngIf="status === 'loading'" class="status-block">
        <div class="spinner"></div>
        <h1>Bekræfter…</h1>
        <p class="subtitle">Vent venligst</p>
      </div>

      <div *ngIf="status === 'success'" class="status-block">
        <div class="status-icon status-icon--success">✓</div>
        <h1>E-mail Bekræftet</h1>
        <p class="subtitle">{{ message }}</p>
        <a routerLink="/login" class="btn btn-primary submit-btn">Log Ind</a>
      </div>

      <div *ngIf="status === 'error'" class="status-block">
        <div class="status-icon status-icon--danger">×</div>
        <h1>Bekræftelse Mislykkedes</h1>
        <p class="subtitle">{{ message }}</p>
        <a routerLink="/login" class="btn btn-outline submit-btn">Tilbage til Log Ind</a>
      </div>
    </div>
  </div>
</div>
